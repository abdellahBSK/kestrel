[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "controlroom"
dynamic = ["version"]
description = "A live dashboard, budget guard and runner for teams of AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
controlroom = "controlroom.runner.orchestrator:main"

[tool.setuptools.dynamic]
version = { attr = "controlroom.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controlroom = ["static/*", "static/assets/*", "runner/*.ps1", "runner/git-hooks/*", "runner/roles/*.md", "runner/rules/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines: the formatter handles what it can
    "B904",  # raise ... from err: adopted gradually
]

[tool.ruff.lint.per-file-ignores]
"src/controlroom/runner/guard.py" = ["E402"]  # the hook bootstraps sys.path before importing the package
