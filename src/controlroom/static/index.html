<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__APP_NAME__</title>
<style>
:root{
  --bg:#0d0e10; --panel:#15171a; --panel2:#1b1e22; --line:#272b31; --text:#e8e6e1; --dim:#9a9ea6; --faint:#5f646c;
  --gold:#d8b25a; --red:#e0525e; --orange:#e3954a; --green:#57c08a; --blue:#6aa5ff; --teal:#4cc3c3; --purple:#b38cff;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 12px}
button:hover{border-color:var(--faint)}
button.danger{background:#3a1519;border-color:#6b2730;color:#ffb4ba}
button.gold{background:#2e2615;border-color:#5c4a22;color:var(--gold)}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:#101114;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:600;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .crown{color:var(--gold);font-size:18px}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.live{color:#bff0d3;border-color:#2c6b48;background:#12261b}
.pill.stop{color:#ffb4ba;border-color:#6b2730;background:#2a1013}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--green);box-shadow:0 0 0 0 rgba(87,192,138,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(87,192,138,.55)}70%{box-shadow:0 0 0 7px rgba(87,192,138,0)}100%{box-shadow:0 0 0 0 rgba(87,192,138,0)}}
.meters{display:flex;gap:16px;flex:1;min-width:300px;flex-wrap:wrap}
.meter{min-width:150px;flex:1}
.meter .lbl{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;position:relative;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar>.warn{position:absolute;top:0;bottom:0;width:1px;background:var(--orange);opacity:.8}
.clock{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 20px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:10px}
.sched{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--dim)}
.sched b{color:var(--text);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#3a3f47}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px #5c4a22 inset}
.card .top{display:flex;align-items:center;gap:8px}
.card .name{font-weight:600}
.key{font:11px/1 ui-monospace,Consolas,monospace;color:var(--gold);border:1px solid #4a3d1d;border-radius:4px;padding:2px 5px}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tag.today{color:var(--gold);border-color:#4a3d1d}
.card .sub{font-size:12px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .now{font-size:12px;margin-top:8px;padding:6px 8px;background:#11201a;border:1px solid #23402f;border-radius:6px;color:#cfeedd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--panel2);margin-top:8px}
.bl i{display:block;height:100%}
.stats{display:flex;gap:10px;font-size:11px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
.stats b{color:var(--text);font-weight:600}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:70vh;display:flex;flex-direction:column}
.dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dhead h2{margin:0;font-size:17px}
.dhead .title{color:var(--dim);font-size:12px;flex-basis:100%}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tab{padding:8px 12px;border:none;background:none;color:var(--dim);border-bottom:2px solid transparent;border-radius:0}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.tab .n{font-size:11px;color:var(--faint);margin-left:4px}
.pane{padding:12px 16px;overflow:auto;flex:1}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
.feed{font-size:13px}
.ev{display:grid;grid-template-columns:62px 92px 1fr;gap:8px;padding:5px 4px;border-bottom:1px solid #1d2024;align-items:start}
.ev:hover{background:#181a1e}
.ev .t{color:var(--faint);font:12px ui-monospace,Consolas,monospace}
.role{font-size:11px;font-weight:600;border-radius:4px;padding:2px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-lead{background:#2e2615;color:var(--gold)} .r-developer{background:#15233a;color:var(--blue)}
.r-tester{background:#132a1e;color:var(--green)} .r-qa{background:#102828;color:var(--teal)}
.r-security{background:#2e1418;color:var(--red)} .r-optimizer{background:#241a36;color:var(--purple)}
.r-subagent{background:#222;color:var(--dim)}
.ev .x{min-width:0;word-break:break-word}
.ev .tool{font:12px ui-monospace,Consolas,monospace;color:var(--dim);margin-right:6px}
.ev.say .x{color:#cfcac0;font-style:italic}
.ev.delegate .x{color:var(--gold)}
.ev.blocked{background:#24101380} .ev.blocked .x{color:#ffb4ba}
.ev.budget,.ev.halt{background:#2a1d0f80} .ev.budget .x,.ev.halt .x{color:#ffd09e}
.badge{font-size:10px;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.b-blocked{background:#6b2730;color:#ffd5d9} .b-error{background:#5a3a14;color:#ffd7a8} .b-running{background:#1c3a2a;color:#bff0d3}
details.res summary{cursor:pointer;color:var(--faint);font-size:11px;list-style:none}
details.res pre{white-space:pre-wrap;font:12px ui-monospace,Consolas,monospace;color:var(--dim);background:#111316;padding:8px;border-radius:6px;margin:4px 0 0}
.agents{display:flex;flex-direction:column;gap:8px}
.agent{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.agent.child{margin-left:28px}
.agent .meta{font-size:12px;color:var(--dim)}
.agent .tok{font:12px ui-monospace,Consolas,monospace;color:var(--text);text-align:right}
.pr{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pr .pt{flex:1;min-width:220px}
.pr .pm{font-size:12px;color:var(--dim)}
.shots{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.shots img{height:220px;border-radius:8px;border:1px solid var(--line);background:#000}
.qs{white-space:pre-wrap;background:var(--panel2);border:1px solid #4a3d1d;border-radius:8px;padding:12px;color:#ece4cf}
h3{font-size:13px;color:var(--dim);font-weight:600;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.6px}
.empty{color:var(--faint);padding:30px;text-align:center}
.toast{position:fixed;bottom:18px;right:18px;background:#1d2126;border:1px solid var(--line);padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;max-width:380px;z-index:10}
.toast.show{opacity:1}
.legend{display:flex;gap:10px;font-size:11px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="crown">♛</span> __APP_NAME__</div>
  <span id="status" class="pill">connecting…</span>
  <div class="meters" id="meters"></div>
  <span class="clock" id="clock"></span>
  <button id="stopBtn" class="danger" title="Agents halt at their next action; no new runs start">STOP all</button>
</header>
<main>
  <div class="side">
    <div class="sched" id="sched"></div>
    <div id="cards"></div>
  </div>
  <section class="detail" id="detail"><div class="empty">Pick a team</div></section>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n||0);
const hhmmss = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}) : "";
const ago = ts => { if(!ts) return ""; const s=(Date.now()-new Date(ts))/1000; return s<60? Math.round(s)+"s ago" : s<3600? Math.round(s/60)+"m ago" : Math.round(s/3600)+"h ago"; };
const ICON = {Bash:"$", PowerShell:"PS", Read:"read", Write:"write", Edit:"edit", MultiEdit:"edit", Grep:"grep", Glob:"find", TodoWrite:"plan", Agent:"⇢", Task:"⇢"};
let state = {ov:null, team:localStorage.getItem("kr.team")||null, tab:localStorage.getItem("kr.tab")||"feed", sess:null, session:null};

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),3500); }
async function post(path){
  const r = await fetch(path,{method:"POST",headers:{"X-Kingdom":"1"}});
  const j = await r.json().catch(()=>({msg:"failed"})); toast(j.msg||"done"); refresh();
}

function meter(label, used, cap, warn){
  const pct = cap? Math.min(100, used/cap*100):0;
  return `<div class="meter"><div class="lbl"><span>${label}</span><span>${fmt(used)}${cap? " / "+fmt(cap):""}</span></div>
  <div class="bar"><i style="width:${pct}%;${pct>=100?'background:var(--red)':pct>=(warn||.8)*100?'background:var(--orange)':''}"></i>${warn?`<span class="warn" style="left:${warn*100}%"></span>`:""}</div></div>`;
}

function renderHeader(ov){
  const b = ov.budget;
  $("#meters").innerHTML = meter("Agents today", b.agents_today, b.agents_daily, b.warn_at) +
    meter("Agents this week", b.agents_week, b.agents_weekly) + meter("You today", b.you_today, 0) + meter("You this week", b.you_week, 0);
  $("#clock").textContent = "updated "+ov.now;
  const st = $("#status");
  if (ov.stop){ st.className="pill stop"; st.textContent="STOP raised"; }
  else if (ov.running){ st.className="pill live"; st.innerHTML=`<span class="dot on"></span>${esc(ov.running.team)} working`; }
  else { st.className="pill"; st.textContent="idle"; }
  const btn = $("#stopBtn");
  if (ov.stop){ btn.textContent="Resume"; btn.className="gold"; btn.onclick=()=>post("/api/resume"); }
  else { btn.textContent="STOP all"; btn.className="danger"; btn.onclick=()=>{ if(confirm("Raise STOP? Running agents halt at their next action and no new runs start until you resume.")) post("/api/stop"); }; }
  const d = ["mon","tue","wed","thu","fri","sat","sun"];
  $("#sched").innerHTML = "<b>Schedule</b> · " + d.map(x => `<span style="${x===ov.today?'color:var(--gold)':''}">${x}: ${esc((ov.schedule[x]||[]).join(", ")||"–")}</span>`).join(" · ");
}

function backlogBar(c){
  const tot = Object.values(c).reduce((a,b)=>a+b,0) || 1;
  const seg = (n,col) => n? `<i style="width:${n/tot*100}%;background:${col}"></i>`:"";
  return `<div class="bl">${seg(c.done,"var(--green)")}${seg(c.review,"var(--blue)")}${seg(c.doing,"var(--gold)")}${seg(c.blocked,"var(--red)")}${seg(c.todo,"#3a3f47")}</div>`;
}

function renderCards(ov){
  if (!state.team || !ov.teams.find(t=>t.team===state.team)) state.team = (ov.running && ov.running.team) || ov.teams[0].team;
  $("#cards").innerHTML = ov.teams.map(t => {
    const c=t.backlog, total=Object.values(c).reduce((a,b)=>a+b,0);
    return `<div class="card ${t.team===state.team?'sel':''}" data-team="${esc(t.team)}" style="margin-bottom:10px">
      <div class="top"><span class="dot ${t.running?'on':''}"></span><span class="name">${esc(t.team)}</span><span class="key">${esc(t.key)}</span>
        ${t.scheduled_today?'<span class="tag today">today</span>':''}${t.mode==="advisory"?'<span class="tag">advisory</span>':''}${t.pr_mode==="draft"?'<span class="tag">draft PRs</span>':''}</div>
      ${t.running && t.now ? `<div class="now">▶ <b>${esc(t.now.agent)}</b> · ${esc(t.now.text)}</div>` : `<div class="sub">${t.last_run? "last run "+esc(t.last_run) : "never run"}</div>`}
      ${t.running ? `<div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,t.used/(t.allowance||1)*100)}%"></i><span class="warn" style="left:80%"></span></div>
        <div class="stats"><span><b>${fmt(t.used)}</b> / ${fmt(t.allowance)} tokens</span></div>` : ""}
      ${total? backlogBar(c):""}
      <div class="stats">${total? `<span><b>${c.done}</b> done</span><span><b>${c.review}</b> in review</span><span><b>${c.todo}</b> todo</span>`:"<span>no backlog yet</span>"}
        ${t.prs.length?`<span style="color:var(--blue)"><b>${t.prs.length}</b> PR</span>`:""}${t.questions?`<span style="color:var(--gold)">❓ questions</span>`:""}</div>
    </div>`;}).join("");
  document.querySelectorAll(".card").forEach(el => el.onclick = () => { state.team = el.dataset.team; state.sess=null; localStorage.setItem("kr.team", state.team); renderCards(state.ov); loadSession(true); });
}

function evRow(e){
  const status = e.status && e.status!=="ok" ? `<span class="badge b-${e.status}">${e.status}</span>` : "";
  const icon = e.kind==="tool"||e.kind==="delegate" ? `<span class="tool">${esc(ICON[e.tool]||e.tool)}</span>` : "";
  const res = e.result ? `<details class="res"><summary>result</summary><pre>${esc(e.result)}</pre></details>` : "";
  return `<div class="ev ${e.kind} ${e.status||""}"><span class="t">${hhmmss(e.ts)}</span><span class="role r-${esc(e.agent)}">${esc(e.agent)}</span>
    <div class="x">${icon}${esc(e.text)}${status}${res}</div></div>`;
}

function renderDetail(){
  const ov = state.ov, t = ov && ov.teams.find(x=>x.team===state.team), s = state.session;
  if (!t){ $("#detail").innerHTML='<div class="empty">Pick a team</div>'; return; }
  const feedEl = document.querySelector(".pane .feed");
  const atBottom = !feedEl || (feedEl.parentElement.scrollHeight - feedEl.parentElement.scrollTop - feedEl.parentElement.clientHeight < 60);
  const prevScroll = feedEl ? feedEl.parentElement.scrollTop : 0;
  const tabs = [["feed","Live feed", s? s.events.length:0],["agents","Agents", s? s.agents.length:0],["prs","Pull requests", t.prs.length],["backlog","Backlog & questions", ""]];
  const sessOpts = s && s.sessions.length ? `<select id="sessSel">${s.sessions.map((x,i)=>`<option value="${x.id}" ${x.id===s.session?'selected':''}>${i===0?'Latest · ':''}${esc(x.when)}</option>`).join("")}</select>` : "";
  let body = "";
  if (state.tab==="feed"){
    body = !s || !s.events.length ? '<div class="empty">No activity recorded for this run yet.</div>' :
      `<div class="legend"><span><i style="background:#6b2730"></i>blocked by guard</span><span><i style="background:#5a3a14"></i>budget / error</span><span><i style="background:#5c4a22"></i>delegation</span></div><div class="feed">${s.events.map(evRow).join("")}</div>`;
  } else if (state.tab==="agents"){
    body = !s ? '<div class="empty">No run yet.</div>' : `<div class="agents">${s.agents.map((a,i)=>`
      <div class="agent ${i?'child':''}"><span class="role r-${esc(a.role)}">${esc(a.role)}</span>
      <div><div>${esc(a.description||"")}</div><div class="meta">${a.actions} actions · ${esc((a.model||"").replace("claude-",""))}${a.start? " · "+hhmmss(a.start)+" → "+hhmmss(a.end):""} · ${a.finished?"finished":"<span style='color:var(--green)'>working</span>"}</div></div>
      <span class="tok">${fmt(a.tokens)}</span></div>`).join("")}</div>
      <div class="meta" style="margin-top:10px;color:var(--faint);font-size:12px">Tokens are Opus-equivalent (Sonnet counts ½, Haiku 1/40).</div>`;
  } else if (state.tab==="prs"){
    body = (t.prs.length ? t.prs.map(p=>`<div class="pr"><div class="pt"><a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.number} ${esc(p.title)}</a>
        <div class="pm">${esc(p.headRefName)} · ${p.isDraft?"draft":(p.reviewDecision||"ready for review").toLowerCase()} · opened ${ago(p.createdAt)}</div></div>
        <button class="gold" data-demo="${p.number}">▶ Demo</button><a href="${esc(p.url)}/files" target="_blank" rel="noopener"><button>Files</button></a></div>`).join("")
      : '<div class="empty">No open pull requests.</div>') +
      `<div style="display:flex;gap:8px;margin-top:6px"><button data-demo="">▶ Demo current main</button></div>` +
      (t.previews.length ? `<h3>Latest screenshots</h3><div class="shots">${t.previews.map(f=>`<a href="/previews/${esc(t.team)}/${esc(f)}" target="_blank"><img loading="lazy" src="/previews/${esc(t.team)}/${esc(f)}" alt="${esc(f)}"></a>`).join("")}</div>` : "");
  } else {
    const c=t.backlog;
    body = `${backlogBar(c)}<div class="stats" style="margin:8px 0 4px"><span><b>${c.done}</b> done</span><span><b>${c.review}</b> in review</span><span><b>${c.doing}</b> in progress</span><span><b>${c.blocked}</b> blocked</span><span><b>${c.todo}</b> todo</span></div>
      <h3>Questions for you</h3>${t.questions? `<div class="qs">${esc(t.questions)}</div><div style="font-size:12px;color:var(--faint);margin-top:6px">Answer them in chat, or edit the team's STATE.md / BACKLOG.md.</div>`:'<div class="empty" style="padding:12px">No open questions.</div>'}
      <h3>Budget</h3><div class="stats"><span>today <b>${fmt(t.today_tokens)}</b></span><span>this week <b>${fmt(t.week_tokens)}</b></span></div>`;
  }
  $("#detail").innerHTML = `<div class="dhead"><h2>${esc(t.team)}</h2><span class="key">${esc(t.key)}</span>
      ${s && s.live ? '<span class="pill live"><span class="dot on"></span>live</span>':''}${sessOpts}
      <span style="flex:1"></span><button id="runBtn" ${state.ov.running||state.ov.stop?'disabled':''}>Run now</button>
      <div class="title">${esc(t.title)}</div></div>
    <div class="tabs">${tabs.map(([k,l,n])=>`<button class="tab ${state.tab===k?'on':''}" data-tab="${k}">${l}${n!==""?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>
    <div class="pane" style="max-height:72vh">${body}</div>`;
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; localStorage.setItem("kr.tab",state.tab); renderDetail();});
  document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>post(`/api/demo?team=${encodeURIComponent(t.team)}&pr=${b.dataset.demo}`));
  const rb=$("#runBtn"); if(rb) rb.onclick=()=>{ if(confirm(`Run ${t.team} now? It uses today's remaining agent budget (${fmt(state.ov.budget.pool)} left).`)) post(`/api/run?team=${encodeURIComponent(t.team)}`); };
  const ss=$("#sessSel"); if(ss) ss.onchange=()=>{ state.sess=ss.value; loadSession(true); };
  const pane=document.querySelector(".pane");
  if (state.tab==="feed" && pane) pane.scrollTop = atBottom ? pane.scrollHeight : prevScroll;
}

async function loadSession(force){
  if (!state.team) return;
  const q = `/api/session?team=${encodeURIComponent(state.team)}` + (state.sess? `&id=${state.sess}`:"");
  try { state.session = await (await fetch(q)).json(); } catch(e) {}
  if (force && state.tab==="feed") { renderDetail(); const p=document.querySelector(".pane"); if(p) p.scrollTop=p.scrollHeight; }
  else renderDetail();
}

let tick = 0;
async function refresh(){
  try {
    state.ov = await (await fetch("/api/overview")).json();
    renderHeader(state.ov); renderCards(state.ov);
    const t = state.ov.teams.find(x=>x.team===state.team);
    if (!state.session || state.session.team!==state.team || (t && t.running) || tick % 5 === 0) await loadSession(false);
    else renderDetail();
  } catch(e){ const st=$("#status"); st.className="pill stop"; st.textContent="__APP_NAME__ offline"; }
  tick++;
}
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
