version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # New releases wait two weeks before we take them.
    cooldown:
      default-days: 14
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
